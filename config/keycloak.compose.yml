services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    pull_policy: never
    container_name: cloudops-keycloak
    command:
      - start
      - --cache=local
      - --db=dev-file
      - --hostname=https://localhost:8443
      - --http-enabled=false
      - --https-certificate-file=/tls/localhost.pem
      - --https-certificate-key-file=/tls/localhost-key.pem
    stop_grace_period: 90s
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - data:/opt/keycloak/data
      - type: bind
        source: ../.private/keycloak/tls
        target: /tls
        read_only: true
        bind:
          create_host_path: false
volumes:
  data:
    external: true
    name: cloudops-keycloak-data-v1
