name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      PYYAML_FORCE_LIBYAML: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run backend tests with isolated databases and mocked Terraform
        run: python -m pytest tests

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Run component tests
        run: npm test
      # Build first so Next.js generates route types on a clean checkout.
      - name: Build production frontend
        run: npm run build
      - name: Check TypeScript
        run: npm run typecheck

  terraform:
    name: Terraform (${{ matrix.directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        directory:
          - terraform/labs/01-foundations
          - terraform/aws/dev
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
      # Downloads providers only. No backend, AWS identity, or variable values needed.
      - name: Initialize for validation
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate Terraform configuration
        run: terraform validate -no-color
      # No plan/apply/destroy, AWS credentials, OIDC, or deployment steps.
